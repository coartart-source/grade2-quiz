<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四年級數學 即時測驗</title>
<style>
  :root{
    --bg:#fbf7ef; --card:#ffffff; --ink:#2b2a33; --muted:#6b6a76;
    --brand:#2f7d6d; --brand-d:#25645a; --line:#e4ddcf;
    --ok:#2e8b57; --ok-bg:#e6f5ec; --bad:#c0392b; --bad-bg:#fcebe8; --warn:#b7791f; --warn-bg:#fdf3dc;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    font-size:20px;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
  header{text-align:center;padding:8px 0 4px}
  h1{font-size:28px;margin:6px 0 2px;color:var(--brand-d)}
  .sub{color:var(--muted);font-size:16px;margin:0}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
  h2{font-size:22px;margin:0 0 10px}
  label.row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;min-height:48px}
  label.row:hover{background:#f6f1e6}
  input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--brand)}
  select{font-size:20px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;min-height:48px}
  .units{max-height:300px;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:6px;margin-top:6px}
  .unit-h{font-weight:700;color:var(--brand-d);padding:8px 6px 2px;font-size:17px}
  .small{font-size:15px;color:var(--muted)}
  .btn{appearance:none;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-weight:700;
    padding:14px 22px;min-height:54px;cursor:pointer;font-size:21px}
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{background:#b9c7c3;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--brand-d);border:2px solid var(--brand)}
  .btn.ghost:hover{background:#eef6f4}
  .btn.block{display:block;width:100%}
  .bar{height:12px;background:#ece5d6;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--brand);transition:width .25s}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--muted);margin:8px 2px}
  .stem{font-size:24px;line-height:1.7;margin:6px 0 12px;white-space:pre-wrap;word-break:break-word}
  .fig{display:block;max-width:100%;height:auto;margin:8px auto 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
  .opts{display:grid;gap:10px}
  .opt{appearance:none;text-align:left;font:inherit;font-size:22px;border:2px solid var(--line);border-radius:14px;background:#fff;
    padding:14px 16px;min-height:58px;cursor:pointer;display:flex;gap:12px;align-items:center}
  .opt:hover:not(:disabled){border-color:var(--brand);background:#f1f8f6}
  .opt .no{flex:none;width:34px;height:34px;border-radius:50%;background:#efe9da;display:grid;place-items:center;font-weight:700;font-size:18px}
  .opt.ok{border-color:var(--ok);background:var(--ok-bg)}
  .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
  .opt:disabled{cursor:default}
  .cmp{display:flex;gap:12px;justify-content:center}
  .cmp .opt{justify-content:center;font-size:34px;min-width:92px;min-height:72px}
  input[type=text],input[type=number],textarea{font:inherit;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff}
  textarea{min-height:100px;resize:vertical}
  .ans-row{display:flex;gap:10px;align-items:stretch}
  .ans-row input{flex:1;min-width:0}
  .fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:21px}
  .fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
  .fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
  .fb.info{background:var(--warn-bg);border:2px solid #e8cf93}
  .fb b{font-size:23px}
  .tag{display:inline-block;font-size:14px;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid #e8cf93;margin-left:6px}
  .score{font-size:56px;font-weight:800;text-align:center;color:var(--brand-d);margin:4px 0}
  .center{text-align:center}
  .wrong-item{border-top:2px dashed var(--line);padding:12px 0}
  .wrong-item:first-child{border-top:0}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btns .btn{flex:1;min-width:170px}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
  footer a{color:var(--brand-d)}
  .hide{display:none!important}
  .sharebtn{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-size:19px;padding:10px 20px;min-height:50px}
  .qr-overlay{position:fixed;inset:0;background:rgba(28,38,36,.72);display:grid;place-items:center;padding:16px;z-index:50}
  .qr-panel{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:100%;overflow:auto;text-align:center}
  .qr-panel h2{margin:0 0 4px;color:var(--brand-d)}
  .qr-box{display:grid;place-items:center;margin:12px auto;padding:12px;background:#fff;border:2px solid var(--line);border-radius:14px;width:fit-content;max-width:100%}
  .qr-box canvas,.qr-box img{width:min(74vw,58vh,420px)!important;height:auto!important;max-width:100%}
  .qr-url{font-size:15px;color:var(--muted);word-break:break-all;user-select:all;margin:4px 0 0}
  .btn:focus-visible,.opt:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
  @media (max-width:480px){
    body{font-size:18px} h1{font-size:24px} .stem{font-size:22px} .opt{font-size:20px} .score{font-size:46px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>四年級數學 即時測驗</h1>
    <p class="sub">選好單元，開始練習，答完馬上知道對不對！</p>
    <button class="btn ghost sharebtn" id="shareBtn" type="button">📱 分享連結（QR Code）</button>
  </header>

  <!-- 設定 -->
  <section id="setup" class="card">
    <h2>1. 選單元</h2>
    <label class="row"><input type="checkbox" id="allUnits" checked> <b>全部單元</b></label>
    <div id="units" class="units"></div>

    <h2 style="margin-top:18px">2. 題數</h2>
    <select id="count" aria-label="題數"></select>
    <span id="avail" class="small" style="margin-left:8px"></span>

    <h2 style="margin-top:18px">3. 設定</h2>
    <label class="row"><input type="checkbox" id="shuffle" checked> 題目順序打亂</label>
    <label class="row hide"><input type="checkbox" id="onlyPage"> 只出「頁面答案」的題目（答案較可靠）</label>
    <label class="row"><input type="checkbox" id="teacher"> 老師模式：標示答案來源（AI 整理或頁面）</label>

    <div style="margin-top:16px"><button class="btn block" id="start">開始測驗</button></div>
    <p id="setupMsg" class="small center"></p>
  </section>

  <!-- 作答 -->
  <section id="quiz" class="hide">
    <div class="meta"><span id="qno"></span><span id="qinfo"></span></div>
    <div class="bar"><i id="prog" style="width:0%"></i></div>
    <div class="card" id="qcard"></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hide">
    <div class="card">
      <h2 class="center">測驗完成！</h2>
      <div class="score" id="scoreBig"></div>
      <p class="center" id="scoreMsg"></p>
      <div class="btns">
        <button class="btn" id="again">再測一次</button>
        <button class="btn ghost" id="retryWrong">只練錯題</button>
        <button class="btn ghost" id="backSetup">回到設定</button>
      </div>
    </div>
    <div class="card" id="wrongBox"><h2>需要再練習的題目</h2><div id="wrongList"></div></div>
  </section>

  <!-- 分享 QR Code -->
  <div id="qrOverlay" class="qr-overlay hide" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="qr-panel">
      <h2 id="qrTitle">掃描 QR Code 開始測驗</h2>
      <p class="small" style="margin:0">打開平板或手機的相機，對準下面的圖案</p>
      <div id="qrBox" class="qr-box"></div>
      <p class="qr-url" id="qrUrl"></p>
      <div class="btns">
        <button class="btn ghost" id="qrCopy" type="button">複製網址</button>
        <button class="btn" id="qrClose" type="button">關閉</button>
      </div>
    </div>
  </div>

  <footer>
    題庫來源：<a href="https://ckj1022-art.github.io/PRIORI/" target="_blank" rel="noopener">學扶歷屆試題網</a>（原作者公開分享，歡迎使用）。<br>
    本測驗在你的裝置上運作，不會上傳任何作答或成績。
  </footer>
</div>

  return e;
}
const CN = {一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
function unitKey(label){
  const m = /^(\d)(上|下)\s*第(.+?)單元/.exec(label || '');
  if (!m) return [99,99,99];
  return [+m[1], m[2]==='上'?0:1, CN[m[3]] || 99];
}
function cmpUnit(a,b){ const x=unitKey(a), y=unitKey(b); return x[0]-y[0] || x[1]-y[1] || x[2]-y[2] || a.localeCompare(b,'zh-Hant'); }
function shuffleArr(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const CIRC = ['①','②','③','④','⑤'];
const show = id => ['setup','quiz','result'].forEach(s => $(s).classList.toggle('hide', s !== id));

/* ---------- 設定畫面 ---------- */
const units = [...new Set(DATA.map(q => q.unit))].sort(cmpUnit);
const unitBox = $('units');
let lastGroup = '';
units.forEach((u,i) => {
  const g = u.slice(0,2);
  if (g !== lastGroup){ unitBox.append(h('div',{class:'unit-h'}, g === '4上' ? '四年級上學期' : '四年級下學期')); lastGroup = g; }
  const n = DATA.filter(q => q.unit === u).length;
  const cb = h('input',{type:'checkbox', value:u});
  cb.addEventListener('change', () => { syncAll(); refreshAvail(); });
  unitBox.append(h('label',{class:'row'}, cb, h('span',null, u.replace(/^\d[上下]\s*/,''), h('span',{class:'small'}, `（${n} 題）`))));
});
function selectedUnits(){
  if ($('allUnits').checked) return units;
  return [...unitBox.querySelectorAll('input:checked')].map(i => i.value);
}
function syncAll(){
  const boxes = [...unitBox.querySelectorAll('input')];
  const anyChecked = boxes.some(b => b.checked);
  if (anyChecked) $('allUnits').checked = false;
  if (!anyChecked) $('allUnits').checked = true;
}
$('allUnits').addEventListener('change', () => {
  unitBox.querySelectorAll('input').forEach(b => b.checked = false);
  $('allUnits').checked = true; refreshAvail();
});
function pool(){
  const us = new Set(selectedUnits());
  return DATA.filter(q => us.has(q.unit) && (!$('onlyPage').checked || q.src === 'page'));
}
function refreshAvail(){
  const n = pool().length;
  const sel = $('count'); const prev = sel.value;
  sel.innerHTML = '';
  [5,10,15,20].filter(x => x < n).forEach(x => sel.append(h('option',{value:x}, `${x} 題`)));
  sel.append(h('option',{value:n}, n ? `全部（${n} 題）` : '沒有題目'));
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  else sel.value = (n >= 10 ? 10 : n);
  $('avail').textContent = `符合條件：${n} 題`;
  $('start').disabled = n === 0;
  $('setupMsg').textContent = n === 0 ? '目前沒有符合的題目，請調整單元或設定。' : '';
}
$('onlyPage').addEventListener('change', refreshAvail);
refreshAvail();

/* ---------- 測驗流程 ---------- */
let quiz = [], idx = 0, results = [], teacherMode = false;

function startQuiz(list){
  quiz = list; idx = 0; results = [];
  teacherMode = $('teacher').checked;
  show('quiz'); renderQ();
}
$('start').addEventListener('click', () => {
  const p = pool(); if (!p.length) return;
  const n = Math.min(+$('count').value || p.length, p.length);
  const base = $('shuffle').checked ? shuffleArr(p) : p.slice().sort((a,b)=> cmpUnit(a.unit,b.unit) || (+a.n - +b.n));
  startQuiz(base.slice(0,n));
  window.scrollTo(0,0);
});

function typeLabel(q){ return q.type === 'mc' ? '選擇題' : q.type === 'short' ? '填答案' : '計算題（自己核對）'; }

function renderQ(){
  const q = quiz[idx];
  $('qno').textContent = `第 ${idx+1} 題 / 共 ${quiz.length} 題`;
  $('qinfo').textContent = q.unit.replace(/^\d[上下]\s*/,'');
  $('prog').style.width = `${(idx/quiz.length)*100}%`;
  const card = $('qcard'); card.innerHTML = '';
  const stem = h('div',{class:'stem'}, q.stem);
  if (teacherMode) stem.append(h('span',{class:'tag'}, q.src === 'ai' ? '答案：AI 整理' : '答案：頁面'));
  card.append(stem);
  if (q.fig) card.append(h('img',{class:'fig', src:q.fig, alt:q.figDesc || '題目圖片'}));
  const body = h('div'); card.append(body);
  const fb = h('div'); card.append(fb);
  const nextBtn = () => h('button',{class:'btn block', style:'margin-top:14px', onclick: next}, idx+1 === quiz.length ? '看結果' : '下一題 →');

  const record = (ok, mine) => { results.push({q, ok, mine}); };

  if (q.type === 'mc'){
    const box = h('div',{class:'opts'}); body.append(box);
    q.opts.forEach((t,i) => {
      const b = h('button',{class:'opt', type:'button'}, h('span',{class:'no'}, CIRC[i]), h('span',null,t));
      b.addEventListener('click', () => {
        const ok = i === q.ai;
        [...box.children].forEach((c,k) => { c.disabled = true; if (k === q.ai) c.classList.add('ok'); });
        if (!ok) b.classList.add('bad');
        record(ok, t);
        fb.className = 'fb ' + (ok ? 'ok':'bad');
        fb.innerHTML = '';
        fb.append(ok ? h('b',null,'答對了！太棒了 🎉') : h('span',null,h('b',null,'再想一想。'),` 正確答案是 ${CIRC[q.ai]} ${q.opts[q.ai]}`));
        card.append(nextBtn());
      });
      box.append(b);
    });
  } else if (q.type === 'short'){
    const isCmp = /^[<>=]$/.test(q.ans);
    const finish = (val) => {
      const ok = isCmp ? val === q.ans : (val.trim() !== '' && Number(val) === Number(q.ans));
      record(ok, val);
      fb.className = 'fb ' + (ok ? 'ok':'bad'); fb.innerHTML = '';
      fb.append(ok ? h('b',null,'答對了！太棒了 🎉') : h('span',null,h('b',null,'再想一想。'),` 正確答案是 ${q.ans}`));
      body.querySelectorAll('button,input').forEach(e => e.disabled = true);
      body.querySelectorAll('.cmp .opt').forEach(b => { if (b.textContent === q.ans) b.classList.add('ok'); else if (b.textContent === val) b.classList.add('bad'); });
      card.append(nextBtn());
    };
    if (isCmp){
      const row = h('div',{class:'cmp'});
      ['<','=','>'].forEach(s => row.append(h('button',{class:'opt', type:'button', onclick:()=>finish(s)}, s)));
      body.append(row);
    } else {
      const inp = h('input',{type:'text', inputmode:'decimal', placeholder:'輸入答案', 'aria-label':'答案', autocomplete:'off'});
      const go = h('button',{class:'btn', type:'button', onclick:()=>finish(inp.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)))}, '確認');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !inp.disabled) go.click(); });
      body.append(h('div',{class:'ans-row'}, inp, go));
      setTimeout(()=>inp.focus(),50);
    }
  } else {
    const ta = h('textarea',{placeholder:'把算式或答案寫在這裡（也可以寫在紙上）', 'aria-label':'我的作答'});
    const see = h('button',{class:'btn block', type:'button', style:'margin-top:10px'}, '看參考答案');
    see.addEventListener('click', () => {
      ta.disabled = true; see.remove();
      fb.className = 'fb info'; fb.innerHTML = '';
      fb.append(h('div',null,h('b',null,'參考答案：'), q.ans), h('div',{class:'small',style:'margin-top:6px'},'和你的答案一樣嗎？自己判斷一下。'));
      const row = h('div',{class:'btns'},
        h('button',{class:'btn', type:'button', onclick:()=>{ record(true, ta.value); row.remove(); card.append(nextBtn()); }}, '我答對了 ✔'),
        h('button',{class:'btn ghost', type:'button', onclick:()=>{ record(false, ta.value); row.remove(); card.append(nextBtn()); }}, '我還要再練習'));
      card.append(row);
    });
    body.append(ta, see);
  }
}

function next(){
  idx++;
  if (idx >= quiz.length) return renderResult();
  renderQ(); window.scrollTo(0,0);
}

function renderResult(){
  show('result'); window.scrollTo(0,0);
  const ok = results.filter(r => r.ok).length, n = results.length;
  $('scoreBig').textContent = `${ok} / ${n}`;
  const r = ok / n;
  $('scoreMsg').textContent = r === 1 ? '全部答對，你真厲害！' : r >= 0.8 ? '很棒！再看看錯的題目就更完美了。' : r >= 0.5 ? '不錯喔，把錯的題目再練習一次吧！' : '沒關係，慢慢來，再練習一次會更好！';
  const wrong = results.filter(r => !r.ok);
  $('wrongBox').classList.toggle('hide', wrong.length === 0);
  $('retryWrong').classList.toggle('hide', wrong.length === 0);
  const list = $('wrongList'); list.innerHTML = '';
  wrong.forEach(({q, mine}) => {
    const it = h('div',{class:'wrong-item'}, h('div',{class:'stem', style:'font-size:20px'}, q.stem));
    if (q.fig) it.append(h('img',{class:'fig', src:q.fig, alt:q.figDesc || '題目圖片', style:'max-height:220px'}));
    const correct = q.type === 'mc' ? `${CIRC[q.ai]} ${q.opts[q.ai]}` : q.ans;
    it.append(h('div',{class:'small'}, `你的答案：${mine === '' || mine == null ? '（沒有作答）' : mine}`), h('div',null, h('b',null,'正確答案：'), correct));
    list.append(it);
  });
}
$('again').addEventListener('click', () => startQuiz(shuffleArr(quiz)));
$('retryWrong').addEventListener('click', () => startQuiz(shuffleArr(results.filter(r => !r.ok).map(r => r.q))));
$('backSetup').addEventListener('click', () => { show('setup'); window.scrollTo(0,0); });

/* ---------- 分享 QR Code ---------- */
const SHARE_URL = 'https://coartart-source.github.io/grade2-quiz/grade4/';
let qrMade = false;
$('qrUrl').textContent = SHARE_URL;
function openShare(){
  $('qrOverlay').classList.remove('hide');
  if (!qrMade){
    const box = $('qrBox'); box.innerHTML = '';
    if (window.QRCode){
      new QRCode(box, {text: SHARE_URL, width: 512, height: 512, colorDark: '#1f2a28', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
      qrMade = true;
    } else {
      box.append(h('p',{class:'small'},'QR Code 沒有產生出來，請確認網路連線後再按一次「分享連結」，或改用下方網址。'));
    }
  }
  $('qrClose').focus();
}
function closeShare(){ $('qrOverlay').classList.add('hide'); $('shareBtn').focus(); }
$('shareBtn').addEventListener('click', openShare);
$('qrClose').addEventListener('click', closeShare);
$('qrOverlay').addEventListener('click', e => { if (e.target === $('qrOverlay')) closeShare(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('qrOverlay').classList.contains('hide')) closeShare(); });
$('qrCopy').addEventListener('click', () => {
  const done = () => { $('qrCopy').textContent = '已複製 ✔'; setTimeout(() => $('qrCopy').textContent = '複製網址', 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('qrUrl')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('qrCopy').textContent = '已選取，請按複製'; };
  try { navigator.clipboard.writeText(SHARE_URL).then(done, fallback); } catch(e){ fallback(); }
});
</script>
</body>
